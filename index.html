<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-Cycle Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3F5;--sf:#fff;--ink:#0F2430;--mu:#5B6E78;--ln:#D9E3E7;--pr:#0B7A75;--reuse:#0B7A75;--repair:#D97F00;--recycle:#2F5BEA;--warn:#B45309;--tint:#E3F1F0}
@media(prefers-color-scheme:dark){:root{--bg:#0B1A22;--sf:#12262F;--ink:#E6F1F4;--mu:#93A9B3;--ln:#243C47;--pr:#2DD4BF;--reuse:#2DD4BF;--repair:#F5A524;--recycle:#7AA2FF;--warn:#F5A524;--tint:#173A3F}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;letter-spacing:-.02em;margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--recycle);outline-offset:2px}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;padding:10px clamp(16px,4vw,40px);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.brand{display:flex;align-items:center;gap:8px;font:700 19px "Bricolage Grotesque",sans-serif;color:var(--pr)}
.seg{display:flex;gap:4px;margin-left:auto;background:var(--sf);border:1px solid var(--ln);border-radius:999px;padding:4px}
.seg button{border:0;background:none;padding:7px 18px;border-radius:999px;cursor:pointer;color:var(--mu);font-weight:500}
.seg button.on{background:var(--pr);color:#fff}
@media(prefers-color-scheme:dark){.seg button.on{color:#06201D}}
main{max-width:1060px;margin:0 auto;padding:20px clamp(16px,4vw,40px) 60px}
.hero{--reuse:#3BE0CB;--repair:#F7B955;--recycle:#93B4FF;display:grid;grid-template-columns:1.25fr 1fr;gap:24px;align-items:center;background:#0A3F44;color:#EAF7F5;border-radius:32px;padding:clamp(24px,5vw,52px);margin-bottom:24px}
.hero h1{font-size:clamp(2.1rem,5.2vw,3.5rem);line-height:1.04;max-width:12ch}
.hero p{max-width:44ch;color:#BFDCD9;margin:16px 0 24px}
.cta{background:#EAF7F5;color:#0A3F44;border:0;border-radius:12px;padding:12px 22px;font-weight:600;cursor:pointer}
.ringbox{display:flex;flex-direction:column;align-items:center;gap:12px;animation:spin 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes spin{from{transform:rotate(-140deg) scale(.8);opacity:0}to{transform:none;opacity:1}}
.ring{width:min(100%,230px)}
.ring circle{fill:none;stroke-width:13}
.ring .trk{stroke:rgba(127,160,160,.25)}
.ring text{fill:currentColor;text-anchor:middle}
.lg{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:14px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.work{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:24px;padding:24px}
.panel h2{font-size:1.4rem;margin-bottom:16px}
.fl{display:block;font-weight:600;font-size:14px;margin:18px 0 8px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px;border:1.5px solid var(--ln);background:none;border-radius:14px;cursor:pointer;font-size:13px;color:var(--mu)}
.tile span{font-size:24px}
.tile.on,.opt.on{border-color:var(--pr);background:var(--tint);color:var(--ink)}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:11px 14px;border:1.5px solid var(--ln);background:none;border-radius:12px;cursor:pointer}
.opt small{display:block;color:var(--mu)}
input[type=text]{width:100%;padding:12px 14px;border:1.5px solid var(--ln);border-radius:12px;background:var(--bg)}
input[type=range]{width:100%;accent-color:var(--pr)}
.go{width:100%;margin-top:22px;background:var(--pr);color:#fff;border:0;border-radius:14px;padding:14px;font-weight:600;font-size:17px;cursor:pointer}
@media(prefers-color-scheme:dark){.go{color:#06201D}}
.err{color:var(--warn);font-size:14px;min-height:20px;margin:8px 0 0}
.res{position:sticky;top:76px}
.empty{color:var(--mu);border-style:dashed}
.out{font:700 2.6rem/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.03em}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:3px 11px;border-radius:999px;background:var(--tint);margin:0 6px 6px 0}
.chip.w{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.pt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--ln)}
.pt b{display:block}.pt small{color:var(--mu)}
.btn{border:1.5px solid var(--pr);color:var(--pr);background:none;border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:disabled{border-color:var(--ln);color:var(--mu);cursor:not-allowed}
.note{font-size:13px;color:var(--mu);margin:14px 0 0}
.dev{margin-bottom:16px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.top h3{font-size:1.25rem;margin-bottom:6px}
.stg{display:flex;list-style:none;margin:22px 0 0;padding:0}
.stg li{flex:1;position:relative;text-align:center;font-size:13px;color:var(--mu);padding:20px 4px 0}
.stg li:before{content:"";position:absolute;top:0;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--sf);border:3px solid var(--ln);z-index:1}
.stg li:after{content:"";position:absolute;top:6px;left:50%;width:100%;height:3px;background:var(--ln)}
.stg li:last-child:after{display:none}
.stg li.done{color:var(--ink)}
.stg li.done:before{background:var(--c);border-color:var(--c)}
.stg li.done:after{background:var(--c)}
.stg li.cur:before{border-color:var(--c)}
.stg li.cur{color:var(--ink);font-weight:600}
.grid{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat{padding:14px;border-radius:16px;background:var(--tint)}
.stat b{display:block;font:700 2rem/1.1 "Bricolage Grotesque",sans-serif}
.stat span{font-size:13px;color:var(--mu)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:820px){.hero,.work,.grid{grid-template-columns:1fr}.res{position:static}.seg button{padding:7px 12px}.brand span{display:none}.stg{flex-direction:column;gap:6px}.stg li{text-align:left;padding:0 0 0 28px}.stg li:before{left:0;top:3px;margin:0}.stg li:after{display:none}}
@media(prefers-reduced-motion:reduce){.ringbox{animation:none}#toast{transition:none}}
</style>
</head>
<body>
<div class="bar">
  <div class="brand"><svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-width="4.5" stroke-dasharray="52 17" stroke-linecap="round" transform="rotate(-60 16 16)"/></svg><span>E-Cycle Connect</span></div>
  <nav class="seg" aria-label="Sections">
    <button data-t="reg" class="on">Register</button><button data-t="track">Track</button><button data-t="impact">Impact</button>
  </nav>
</div>
<main>
  <section class="hero">
    <div>
      <h1>Give old electronics another loop.</h1>
      <p>Tell us what you have. We recommend whether to repair, reuse or recycle it, point you to a trusted drop-off, and follow it until it is done.</p>
      <button class="cta" id="cta">Register a device</button>
    </div>
    <div class="ringbox" id="hero"></div>
  </section>

  <section id="reg" class="work">
    <div class="panel">
      <h2>What are you letting go of?</h2>
      <span class="fl" style="margin-top:0">Device type</span>
      <div class="tiles" id="tiles"></div>
      <label class="fl" for="model">Brand and model</label>
      <input type="text" id="model" placeholder="For example, Samsung A12" maxlength="40" autocomplete="off">
      <label class="fl" for="age">Age: <span id="agev">3 years</span></label>
      <input type="range" id="age" min="0" max="15" value="3">
      <span class="fl">Condition</span>
      <div class="opts" id="conds"></div>
      <button class="go" id="go">Get recommendation</button>
      <p class="err" id="err" role="alert"></p>
    </div>
    <div class="res" id="res"></div>
  </section>
  <section id="track" hidden></section>
  <section id="impact" hidden></section>
</main>
<div id="toast" role="status"></div>

<script>
// Sample partners and weights for the demo (not real businesses)
var POINTS=[
 {n:"Campus E-Waste Bin",km:0.4,v:true,t:["recycle","reuse"]},
 {n:"Community Repair Cafe",km:2.1,v:true,t:["repair","reuse"]},
 {n:"Certified Recycler",km:6.5,v:true,t:["recycle"]},
 {n:"Local Scrap Dealer",km:1.2,v:false,t:["recycle","repair"]},
 {n:"School Donation Drive",km:3.0,v:true,t:["reuse"]}];
var TYPES=[["Phone","📱",.2],["Laptop","💻",2.5],["Charger","🔌",.1],["Battery","🔋",.05],["TV / monitor","📺",10],["Other","📦",1]];
var CONDS=[["working","Works fine","Still does what it should"],["minor","Minor fault","Cracked screen, weak battery"],["dead","Not working","Will not switch on or charge"]];
var STAGES={
 reuse:["Registered","Handed over","Quality checked","Reused or donated"],
 repair:["Registered","Handed over","Repaired","Returned or reused"],
 recycle:["Registered","Collected by verified recycler","Dismantled and sorted","Materials recovered"]};
var COL={reuse:"var(--reuse)",repair:"var(--repair)",recycle:"var(--recycle)"};
var SHIELD='<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5z" fill="currentColor"/><path d="M8.5 12l2.5 2.5 4.5-5" stroke="#fff" stroke-width="2" fill="none"/></svg>';
var sel={type:0,cond:"working"},cur=null,devices=[],tt;

function $(i){return document.getElementById(i)}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function load(){try{devices=JSON.parse(localStorage.getItem("ecc")||"[]")}catch(e){devices=[]}}
function save(){try{localStorage.setItem("ecc",JSON.stringify(devices))}catch(e){}}
function counts(){var c={reuse:0,repair:0,recycle:0};devices.forEach(function(d){c[d.a]++});return c}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("on")},2600)}

// Rule-based recommendation engine
function recommend(type,cond,age){
 if(type==="Battery")return{a:"recycle",why:"Batteries are hazardous, so they go only to a verified recycler."};
 if(cond==="working")return{a:"reuse",why:"It still works. Donating or reselling it keeps it in use the longest."};
 if(cond==="minor")return{a:"repair",why:"A minor fault is usually cheaper to repair than to replace."};
 return{a:"recycle",why:age>10?"It is old and not working, so its materials are best recovered safely.":"It is not working, so its parts and materials are best recovered safely."};
}

function ring(size){
 var c=counts(),tot=c.reuse+c.repair+c.recycle,L=2*Math.PI*48,off=0,s='<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="Devices by outcome"><circle class="trk" cx="60" cy="60" r="48"/>';
 ["reuse","repair","recycle"].forEach(function(k){
  if(!c[k])return;var len=L*c[k]/tot,g=tot>1?3:0;
  s+='<circle cx="60" cy="60" r="48" stroke="'+COL[k]+'" stroke-dasharray="'+Math.max(len-g,1)+' '+(L-len+g)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 60 60)"/>';off+=len});
 return s+'<text x="60" y="64" font-size="30" font-weight="700" font-family="Bricolage Grotesque,sans-serif">'+tot+'</text><text x="60" y="80" font-size="10">'+(tot===1?"device":"devices")+'</text></svg>';
}
function legend(){var c=counts();return'<div class="lg">'+["reuse","repair","recycle"].map(function(k){return'<span><i style="background:'+COL[k]+'"></i>'+k[0].toUpperCase()+k.slice(1)+" "+c[k]+'</span>'}).join("")+'</div>'}
function hero(){$("hero").innerHTML=ring()+legend()}

function drawForm(){
 $("tiles").innerHTML=TYPES.map(function(t,i){return'<button class="tile'+(i===sel.type?" on":"")+'" data-ty="'+i+'"><span>'+t[1]+'</span>'+t[0]+'</button>'}).join("");
 $("conds").innerHTML=CONDS.map(function(c){return'<button class="opt'+(c[0]===sel.cond?" on":"")+'" data-c="'+c[0]+'"><b>'+c[1]+'</b><small>'+c[2]+'</small></button>'}).join("");
}
function emptyRes(){$("res").innerHTML='<div class="panel empty"><h2>Your recommendation</h2><p>Add the details on the left and we will show whether to repair, reuse or recycle, plus the best places to take it.</p></div>'}

function showTab(t){
 ["reg","track","impact"].forEach(function(k){$(k).hidden=(k!==t)});
 document.querySelectorAll(".seg button").forEach(function(b){b.classList.toggle("on",b.dataset.t===t)});
 if(t==="track")renderTrack();if(t==="impact")renderImpact();
}

function getRec(){
 var model=$("model").value.trim();
 if(!model){$("err").textContent="Enter the brand or model so we can track it.";$("model").focus();return}
 $("err").textContent="";
 var T=TYPES[sel.type],age=Number($("age").value),r=recommend(T[0],sel.cond,age);
 cur={type:T[0],model:model,a:r.a,w:T[2]};
 var pts=POINTS.filter(function(p){return p.t.indexOf(r.a)>-1}).sort(function(x,y){return(y.v-x.v)||(x.km-y.km)});
 var h='<div class="panel"><div class="out" style="color:'+COL[r.a]+'">'+r.a[0].toUpperCase()+r.a.slice(1)+'</div><p>'+esc(r.why)+'</p><span class="chip">'+T[1]+" "+esc(T[0])+'</span><span class="chip">About '+T[2]+' kg kept out of landfill</span>'+
  '<h3 style="margin:18px 0 4px;font-size:1.1rem">Where to take it</h3>';
 pts.forEach(function(p){
  var no=(r.a==="recycle"&&!p.v);
  h+='<div class="pt"><div><b>'+esc(p.n)+'</b><small>'+p.km+' km away</small><br>'+(p.v?'<span class="chip" style="color:var(--pr)">'+SHIELD+' Verified partner</span>':'<span class="chip w">Not verified</span>')+'</div>'+
   '<button class="btn" data-p="'+POINTS.indexOf(p)+'"'+(no?' disabled title="Recycling is only allowed through verified partners"':'')+'>'+(no?'Not allowed':'Book drop-off')+'</button></div>'});
 $("res").innerHTML=h+'<p class="note">Sample partners for the demo. Unverified partners cannot take recycling, so waste is not pushed somewhere less safe.</p></div>';
 if(innerWidth<821)$("res").scrollIntoView({behavior:"smooth"});
}

function book(i){
 devices.unshift({id:Date.now(),type:cur.type,model:cur.model,a:cur.a,w:cur.w,point:POINTS[i].n,stage:0});
 save();$("model").value="";emptyRes();hero();toast("Drop-off booked. Tracking started.");showTab("track");
}

function renderTrack(){
 if(!devices.length){$("track").innerHTML='<div class="panel empty"><h2>Nothing to track yet</h2><p>Register a device and its journey will appear here.</p><button class="btn" data-t="reg">Register a device</button></div>';return}
 var h="";
 devices.forEach(function(d){
  var s=STAGES[d.a],last=s.length-1,fin=d.stage===last;
  h+='<div class="panel dev" style="--c:'+COL[d.a]+'"><div class="top"><div><h3>'+esc(d.model)+'</h3><span class="chip">'+esc(d.type)+'</span><span class="chip" style="color:'+COL[d.a]+'">'+d.a+'</span><span class="chip">'+esc(d.point)+'</span></div>'+
   (fin?'<span class="chip">Journey complete</span>':'<button class="btn" data-adv="'+d.id+'">Advance stage</button>')+'</div><ol class="stg">';
  s.forEach(function(n,i){h+='<li class="'+(i<d.stage||fin?"done":i===d.stage?"cur":"")+'">'+n+'</li>'});
  h+='</ol></div>'});
 $("track").innerHTML=h+'<button class="btn" id="reset">Clear demo data</button>';
}

function renderImpact(){
 var c=counts(),done=devices.filter(function(d){return d.stage===STAGES[d.a].length-1}).length,kg=devices.reduce(function(s,d){return s+d.w},0);
 function st(n,l){return'<div class="stat"><b>'+n+'</b><span>'+l+'</span></div>'}
 $("impact").innerHTML='<div class="panel"><h2>Your impact so far</h2><div class="grid"><div style="width:210px;margin:auto">'+ring()+legend()+'</div><div><div class="stats">'+
  st(devices.length,"devices registered")+st(done,"journeys completed")+st(kg.toFixed(2)+" kg","e-waste handled (estimate)")+st(c.repair+c.reuse,"given a longer life")+
  '</div><p class="note">Weights are rough assumptions for the demo. Repair and reuse extend product life (SDG 12), and tracking makes recycling accountable.</p></div></div></div>';
}

document.addEventListener("click",function(e){
 var b=e.target.closest("button");if(!b)return;var d=b.dataset;
 if(d.t)showTab(d.t);
 if(d.ty!==undefined){sel.type=Number(d.ty);drawForm()}
 if(d.c){sel.cond=d.c;drawForm()}
 if(b.id==="go")getRec();
 if(b.id==="cta"){showTab("reg");$("model").focus()}
 if(d.p!==undefined&&!b.disabled)book(Number(d.p));
 if(d.adv){devices.forEach(function(x){if(String(x.id)===d.adv)x.stage++});save();renderTrack();toast("Stage updated.")}
 if(b.id==="reset"){devices=[];save();renderTrack();hero()}
});
$("age").addEventListener("input",function(e){var v=e.target.value;$("agev").textContent=v+(v==="1"?" year":" years")});
load();drawForm();emptyRes();hero();
</script>
</body>
</html>
